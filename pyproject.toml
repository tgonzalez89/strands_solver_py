[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "strands_solver"
version = "0.1.0"
description = "."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Tomas Gonzalez Aragon", email = "tomas.gonz.arg@gmail.com" },
]
keywords = ["strands_solver"]
requires-python = ">=3.14"
# Runtime dependencies for end users of the library/CLI.
# Keep this stub even when empty so adding first-party requirements is obvious.
dependencies = []

[project.optional-dependencies]
device = [
  "numpy>=2.4.4",
  "opencv-python>=4.13.0.92",
  "pillow>=12.2.0",
  "tesserocr>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/tgonzalez89/strands_solver"
Repository = "https://github.com/tgonzalez89/strands_solver"
Issues = "https://github.com/tgonzalez89/strands_solver/issues"

[project.scripts]
strands_solver = "strands_solver.cli.bot:main"
strands_words = "strands_solver.cli.board_words:main"
strands_board_image = "strands_solver.cli.board_image:main"

# ---------------------------------------------------------------------------
# Hatch build config (src layout)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/strands_solver"]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) - preferred modern workflow for local/dev tooling.
# Keep only developer tooling here; user-facing optional runtime deps belong in
# [project.optional-dependencies].
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.1",
  "ruff>=0.11",
  "ty>=0.0.1a8",
]

# ---------------------------------------------------------------------------
# Ruff - linting + formatting (replaces black, isort, flake8, pylint)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Absense of trailing comma is OK since formatter automatically adds them when needed.
  "D203",   # Conflicts with D211.
  "D213",   # Conflicts with D212.
  "FIX002", # Allow TODO comments without requiring immediate resolution.
  "S311",   # Allow `random` module usage for non-cryptographic purposes.
  "T201",   # Allow print statements. They are used in the CLI and for debugging.
  "TD",     # Allow TODO format/link/author variations globally.
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG001",  # Allow unused arguments in functions (e.g., fixtures).
  "ARG002",  # Allow unused arguments in methods (e.g., fixtures).
  "ARG005",  # Allow unused arguments in class methods (e.g., fixtures).
  "D100",    # Allow missing docstring in public modules.
  "D101",    # Allow missing docstring in public classes.
  "D102",    # Allow missing docstring in public methods.
  "D103",    # Allow missing docstring in public functions.
  "D107",    # Allow missing docstring in __init__ methods.
  "INP001",  # Test don't need to be part of a package.
  "PLR2004", # Magic values are often fine in tests.
  "SLF001",  # Tests often need access to private members.
  "S101",    # Plain assert is standard Pytest style.
]

[tool.ruff.lint.isort]
known-first-party = ["strands_solver"]


# ---------------------------------------------------------------------------
# ty - type checker (Astral)
# ---------------------------------------------------------------------------
[tool.ty.environment]
root = ["src"]

[tool.ty.rules]
all = "error"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=strands_solver",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-fail-under=80",
]
xfail_strict = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/strands_solver"]
branch = true
omit = ["*/cli/*.py"]           # CLI tested via integration; adjust as needed

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
